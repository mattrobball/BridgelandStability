name = "BridgelandStability"
version = "0.1.0"
keywords = ["math"]
# Challenge is deliberately NOT a default target: `lake exe runLinter` lints the
# default targets, and the Challenge is generated, sorry-carrying code that the
# Mathlib declaration linter should not police. CI builds it explicitly.
defaultTargets = ["BridgelandStability"]

[leanOptions]
autoImplicit = false

[[require]]
name = "informal"
git = "https://github.com/mattrobball/lean-informal"
rev = "feat/tfb-preserve-elaboration-env"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "BridgelandStability"
srcDir = "."

# The Comparator Challenge: the auditable statement surface. Its own library so
# that its import closure stays Mathlib-only — Palomar recompiles the Challenge
# against a frozen Lean core + Mathlib environment and rejects any source
# outside that allowlist, including project-local helpers and `Informal`.
# Generated by `lake exe tfb_skeleton`; see .github/workflows/update-trusted-base.yml.
[[lean_lib]]
name = "Challenge"
srcDir = "."