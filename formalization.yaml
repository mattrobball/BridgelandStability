# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

# ── WHAT ──────────────────────────────────────────────
project:
  name: "BridgelandStability"
  description: >-
    AI-assisted Lean 4 / Mathlib formalization of the main results of Tom
    Bridgeland's "Stability conditions on triangulated categories" (Annals of
    Mathematics 166 (2007), 317-345). Covers Sections 2-7 of the paper,
    culminating in Theorem 1.2, that the central charge map is a local
    homeomorphism on each connected component of Stab(D), and Corollary 1.3,
    that connected components of Stab_N(D) are finite-dimensional complex
    manifolds. Both are proved in class-map generality, for an arbitrary
    surjective class map v : K₀(D) →+ Λ as in Bayer–Macrì–Stellari and
    Bayer–Lahoz–Macrì–Nuer–Perry–Stellari, then specialized to the identity
    for Theorem 1.2 and to the numerical quotient for Corollary 1.3; the
    classical Stab(D) is the case v = id. Supporting development includes
    slicings and Harder-Narasimhan filtrations, the quasi-abelian structure of
    interval subcategories P((a,b)), the Grothendieck and numerical
    Grothendieck groups, the Euler form, and the deformation argument
    underlying the local homeomorphism result.
  url: "https://github.com/mattrobball/BridgelandStability"
  date: "2026-03-20"
  authors:
    - "Matthew Robert Ballard"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Matthew Robert Ballard"
  organization: "independent"
  funding:
    - "Renaissance Philanthropy"  # AI for Math fund
    - "OpenAI"                    # Free year of ChatGPT Pro
  contribution_target: "mathlib"
  maintenance: "active"

repository:
  role: "substantive-development"

classification:
  arxiv:
    - "math.AG"
    - "math.CT"
  msc2020:
    - "18G80"
    - "14F08"

# ── FROM WHAT ─────────────────────────────────────────
sources:
  - title: "Stability conditions on triangulated categories"
    authors:
      - "Tom Bridgeland"
    id: "arXiv:math/0212237v3"      # DOI: 10.4007/annals.2007.166.317
    type: "paper"
    location: "https://doi.org/10.4007/annals.2007.166.317"
    relationship: "adapts"
    license: "publisher-restricted"  # Annals of Mathematics
    size_bytes: 68866                # pdftotext of arXiv:math/0212237v3 (29 pages)

# ── WITH WHAT ─────────────────────────────────────────
toolchain:
  system: "lean4"
  system_version: "v4.29.0"
  dependencies:
    - "mathlib v4.29.0 (8a178386ffc0f5fef0b77738bb5449d50efeea95)"
    - "lean-informal main (7a6c563388e016b597c0a13f3662c1d39dcc674f)"
  build_manifest_url: "https://github.com/mattrobball/BridgelandStability/blob/main/lake-manifest.json"

# ── PROJECT STATUS ──────────────────────────────────
status:
  scope: >
    Formalization of the main results (Sections 2-7) of Bridgeland's
    "Stability conditions on triangulated categories" (Annals 2007).
    Theorem 1.2 (central charge is local homeomorphism on connected
    components) and Corollary 1.3 (connected components of numerical
    stability conditions are finite-dimensional complex manifolds),
    both generalized to arbitrary surjective class maps.
  sorry_count: 0
  sorry_in_definitions: 0
  builds_clean: true
  builds_clean_date: "2026-04-10"
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "CategoryTheory.Triangulated.NumericalStabilityCondition.existsComplexManifoldOnConnectedComponent"
      file: "BridgelandStability/NumericalStabilityManifold.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"
      literature_dependencies: []

# ── HOW (MACHINE) ───────────────────────────────────
automation:
  methods:
    - method: "agent"
      framework: "custom"             # Claude Code + Codex CLI, dual-agent parallel workflow
      models:
        - "claude-opus-4-6: formalization"  # primary: definitions, proofs, refactoring, sorry-closing
        - "claude-opus-4-6: review"         # fidelity audits, code review
        - "gpt-5.4: formalization"          # Codex CLI: parallel proof attempts, sorry-closing
        - "gpt-5.4: review"                 # plan auditing, fidelity review (52 of 78 sessions)
        - "claude-sonnet-4-6: translation"  # CI: informal prose generation for @[informal] tags
        - "chatgpt-5.2-pro: translation"    # paper to blueprint

      # ── HOW MUCH ───────────────────────────────────────
      cost:
        wall_time: "17 days (2026-03-05 to 2026-03-21)"
        compute_time: >
          337h with >= 1 AI session active (de-overlapped from 753h sum of
          705 sessions, peak 8 concurrent). Claude: 216M new tokens (1.5M
          input + 199M cache-create + 15M output) + 10.0B cache-read, 621
          sessions. Codex: 203M new tokens (187M uncached input + 16M
          output incl 10M reasoning) + 3.3B cached input, 78 sessions.
        person_hours: "31.4"            # 5-min gap analysis on merged Claude+Codex+commit timestamps
        spend_usd: >
          ~$255 actual (17/30 month x ($250 Claude Max + $200 ChatGPT Pro)).
          List-rate equivalent estimated at ~$8.9k from local session logs
          and published API pricing (Claude Opus 4.6: $5/$25 per MTok,
          cache read $0.50/MTok; GPT-5.4: $2.50/$15 per MTok, cached input
          $0.25/MTok). Estimate is likely high — local token counters may
          not match billing exactly.
        hardware: "API-only"
        includes_failures: true

# ── HOW FAITHFUL ────────────────────────────────────
fidelity:
  source_mapping:
    method: "inline-comments"     # @[informal] attributes + informalizations.json extraction
    url: "https://mattrobball.github.io/BridgelandStability/"

  divergences: >
    Theorem 1.2 and Corollary 1.3 are proved for arbitrary surjective
    class maps v: K_0(D) ->+ Lambda, generalizing the paper's identity
    (Theorem 1.2) and numerical quotient (Corollary 1.3) cases.

review:
  status: "self-assessed"

# ── SELF-ASSESSMENT ─────────────────────────────────
self_assessment:
  source_detail_level: "standard"
  math_sophistication: "research"
  dependency_distance: "moderate-far" # builds on Mathlib triangulated/abelian/manifold but substantial new development
  formalization_quality: "draft"

# ── COMMUNITY ───────────────────────────────────────
community:
  related_projects:
    - "Joël Riou's Mathlib triangulated categories and t-structure infrastructure"
  upstream_prs: []
  reviews: []

